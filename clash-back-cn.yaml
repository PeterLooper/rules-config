# Clash / Mihomo rules - China traffic through PROXY, other traffic direct
# Includes a PROXY selector that collects all available proxy nodes.

proxy-groups:
  - name: PROXY
    type: select
    include-all: true
    proxies:
      - DIRECT

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query#PROXY
    - https://dns.google/dns-query#PROXY

tun:
  enable: true
  stack: mixed
  auto-route: true
  dns-hijack:
    - any:53

rule-providers:
  cn-domain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    path: ./ruleset/loyalsoldier-cn-domain.txt
    interval: 86400
  cn-ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list
    path: ./ruleset/blackmatrix7-cn-ip.txt
    interval: 86400

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

