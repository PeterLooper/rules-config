# Clash / Mihomo rules - China traffic through PROXY, other traffic direct
# Includes a PROXY selector that collects all available proxy nodes.

proxy-groups:
  - name: PROXY
    type: select
    include-all: true
    proxies:
      - DIRECT

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query#PROXY
    - https://dns.google/dns-query#PROXY

tun:
  enable: true
  stack: mixed
  auto-route: true
  dns-hijack:
    - any:53

rule-providers:
  cn-domain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    path: ./ruleset/loyalsoldier-cn-domain.txt
    interval: 86400
  cn-ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list
    path: ./ruleset/blackmatrix7-cn-ip.txt
    interval: 86400

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # JegoTrip / Wuyouxing stays direct
  - DOMAIN-SUFFIX,jegotrip.com,DIRECT
  - DOMAIN-SUFFIX,jegotrip.com.cn,DIRECT

  # WeChat stays direct
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,weixin.com,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,wechatapp.com,DIRECT
  - DOMAIN-SUFFIX,servicewechat.com,DIRECT
  - DOMAIN-SUFFIX,wechatpay.com,DIRECT
  - DOMAIN-SUFFIX,tenpay.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,qlogo.cn,DIRECT

  # Apple services stay direct
  - DOMAIN-SUFFIX,apple.com,DIRECT
  - DOMAIN-SUFFIX,aaplimg.com,DIRECT
  - DOMAIN-SUFFIX,apple-cloudkit.com,DIRECT
  - DOMAIN-SUFFIX,apple-mapkit.com,DIRECT
  - DOMAIN-SUFFIX,apple-dns.net,DIRECT
  - DOMAIN-SUFFIX,apple.news,DIRECT
  - DOMAIN-SUFFIX,applepay.com,DIRECT
  - DOMAIN-SUFFIX,appstore.com,DIRECT
