# Clash Party override - China traffic via selected proxy group, other traffic direct
# This file uses the existing policy group named "节点选择".

rule-providers:
  cn-domain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    path: ./ruleset/loyalsoldier-cn-domain.txt
    interval: 86400
  cn-ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/cncidr.txt
    path: ./ruleset/loyalsoldier-cn-ip.txt
    interval: 86400

+rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ByteDance overseas / TikTok
  - DOMAIN-SUFFIX,tiktok.com,DIRECT
  - DOMAIN-SUFFIX,tiktokv.com,DIRECT
  - DOMAIN-SUFFIX,tiktokcdn.com,DIRECT
  - DOMAIN-SUFFIX,tiktokcdn-us.com,DIRECT
  - DOMAIN-SUFFIX,tik-tokapi.com,DIRECT
  - DOMAIN-SUFFIX,musical.ly,DIRECT
  - DOMAIN-SUFFIX,muscdn.com,DIRECT
  - DOMAIN-SUFFIX,byteoversea.com,DIRECT
  - DOMAIN-SUFFIX,byteoversea.net,DIRECT
  - DOMAIN-SUFFIX,bytedance.net,DIRECT
  - DOMAIN-SUFFIX,ibytedtos.com,DIRECT

  # ByteDance China / Douyin
  - DOMAIN-SUFFIX,douyin.com,节点选择
  - DOMAIN-SUFFIX,iesdouyin.com,节点选择
  - DOMAIN-SUFFIX,douyinpic.com,节点选择
  - DOMAIN-SUFFIX,douyinvod.com,节点选择
  - DOMAIN-SUFFIX,douyinstatic.com,节点选择
  - DOMAIN-SUFFIX,bytedance.com,节点选择
  - DOMAIN-SUFFIX,byteimg.com,节点选择
  - DOMAIN-SUFFIX,toutiao.com,节点选择
  - DOMAIN-SUFFIX,toutiaoimg.com,节点选择
  - DOMAIN-SUFFIX,pstatp.com,节点选择
  - DOMAIN-SUFFIX,snssdk.com,节点选择
  - DOMAIN-SUFFIX,ixigua.com,节点选择
  - DOMAIN-SUFFIX,doubao.com,节点选择
  - DOMAIN-SUFFIX,coze.cn,节点选择
  - DOMAIN-SUFFIX,volcengine.com,节点选择
  - DOMAIN-SUFFIX,volces.com,节点选择

  - DOMAIN-SUFFIX,cn,节点选择
  - DOMAIN-SUFFIX,中国,节点选择
  - DOMAIN-SUFFIX,公司,节点选择
  - DOMAIN-SUFFIX,网络,节点选择
  - RULE-SET,cn-domain,节点选择
  - RULE-SET,cn-ip,节点选择,no-resolve
  - GEOIP,CN,节点选择
  - MATCH,DIRECT
