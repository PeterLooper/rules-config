# Clash Party override - China direct, other traffic via selected proxy group
# This file uses the existing policy group named "节点选择".

rule-providers:
  gfw:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt
    path: ./ruleset/loyalsoldier-gfw.txt
    interval: 86400
  cn-domain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    path: ./ruleset/loyalsoldier-cn-domain.txt
    interval: 86400
  cn-ip:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/cncidr.txt
    path: ./ruleset/loyalsoldier-cn-ip.txt
    interval: 86400

+rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ByteDance overseas / TikTok
  - DOMAIN-SUFFIX,tiktok.com,节点选择
  - DOMAIN-SUFFIX,tiktokv.com,节点选择
  - DOMAIN-SUFFIX,tiktokcdn.com,节点选择
  - DOMAIN-SUFFIX,tiktokcdn-us.com,节点选择
  - DOMAIN-SUFFIX,tik-tokapi.com,节点选择
  - DOMAIN-SUFFIX,musical.ly,节点选择
  - DOMAIN-SUFFIX,muscdn.com,节点选择
  - DOMAIN-SUFFIX,byteoversea.com,节点选择
  - DOMAIN-SUFFIX,byteoversea.net,节点选择
  - DOMAIN-SUFFIX,bytedance.net,节点选择
  - DOMAIN-SUFFIX,ibytedtos.com,节点选择

  # ByteDance China / Douyin
  - DOMAIN-SUFFIX,douyin.com,DIRECT
  - DOMAIN-SUFFIX,iesdouyin.com,DIRECT
  - DOMAIN-SUFFIX,douyinpic.com,DIRECT
  - DOMAIN-SUFFIX,douyinvod.com,DIRECT
  - DOMAIN-SUFFIX,douyinstatic.com,DIRECT
  - DOMAIN-SUFFIX,bytedance.com,DIRECT
  - DOMAIN-SUFFIX,byteimg.com,DIRECT
  - DOMAIN-SUFFIX,toutiao.com,DIRECT
  - DOMAIN-SUFFIX,toutiaoimg.com,DIRECT
  - DOMAIN-SUFFIX,pstatp.com,DIRECT
  - DOMAIN-SUFFIX,snssdk.com,DIRECT
  - DOMAIN-SUFFIX,ixigua.com,DIRECT
  - DOMAIN-SUFFIX,doubao.com,DIRECT
  - DOMAIN-SUFFIX,coze.cn,DIRECT
  - DOMAIN-SUFFIX,volcengine.com,DIRECT
  - DOMAIN-SUFFIX,volces.com,DIRECT

  - RULE-SET,gfw,节点选择
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
